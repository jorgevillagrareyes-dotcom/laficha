site_name: La Ficha
site_description: Resúmenes de medicina interna para el internado y el EUNACOM, por Jorge Villagra. Basados en las guías clínicas vigentes y con datos chilenos.
site_url: https://jorgevillagrareyes-dotcom.github.io/laficha/
repo_url: https://github.com/jorgevillagrareyes-dotcom/laficha
repo_name: Código fuente
site_author: Jorge Villagra Reyes
copyright: "Resúmenes elaborados por Jorge Villagra, estudiante de medicina de la Universidad de Valparaíso, con apoyo de IA a partir de guías clínicas. Material de estudio de uso libre y sin fines comerciales; verificar siempre con la fuente original."
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: es
  # Fuentes servidas desde el sitio (docs/assets/fuentes), sin Google Fonts
  font: false
  icon:
    logo: material/stethoscope
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

# Mermaid se sirve localmente para que los diagramas funcionen sin conexión.
extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/laficha.js
  - javascripts/calculadoras.js

hooks:
  - hooks/acentos.py
  - hooks/offline.py
  - hooks/preguntas.py

plugins:
  - search:
      lang: es
  - tags
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: auto
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption

