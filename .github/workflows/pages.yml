name: Publicar sitio

on:
  push:
    branches: [claude/amazing-hamilton-wkzqpo, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Crear zip para usar sin internet
        run: |
          find site -name "*.map" -delete
          cd site && zip -qr ../la-ficha-offline.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: la-ficha-offline
          path: la-ficha-offline.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages a veces tarda más de los 10 minutos por defecto en copiar el sitio
          timeout: 1800000
