orden: 2
titulo: Antivirales, antifúngicos y antiparasitarios
familias:
  - Antivirales
  - Antifúngicos
  - Antiparasitarios y antipalúdicos
farmacos:
  - n: Aciclovir
    g: Antiviral análogo de nucleósido
    fam: Antivirales
    q: Inhibe la ADN polimerasa de los virus herpes simple y varicela zóster tras ser activado por la timidina quinasa viral.
    u:
      - Encefalitis herpética (también empírica ante la sospecha).
      - Herpes genital, herpes zóster y varicela del adulto.
      - Infecciones herpéticas graves en inmunosuprimidos.
    d:
      - Encefalitis 10 mg/kg EV cada 8 h por 14–21 días.
      - Herpes zóster o varicela 800 mg VO 5 veces al día por 7 días.
      - Primoinfección por herpes genital 400 mg VO cada 8 h por 7–10 días.
    a: Ajustar a la función renal.
    c: Alergia a aciclovir o valaciclovir.
    e: Nefrotoxicidad por cristales (hidratar bien con la vía EV), neurotoxicidad (confusión, temblor) en la ERC y flebitis.
    i: Más nefrotoxicidad con otros nefrotóxicos.
    em: Compatible con el embarazo y la lactancia.
  - n: Valaciclovir
    g: Antiviral · profármaco del aciclovir
    fam: Antivirales
    q: Profármaco oral del aciclovir con mejor biodisponibilidad, que permite menos tomas al día.
    u:
      - Herpes zóster (idealmente en las primeras 72 h).
      - Herpes genital (primoinfección, recurrencias y supresión) y herpes labial.
      - Parálisis facial con sospecha de síndrome de Ramsay Hunt (con corticoides).
    d:
      - Herpes zóster 1 g VO cada 8 h por 7 días.
      - Primoinfección genital 1 g VO cada 12 h por 7–10 días; recurrencia 500 mg cada 12 h por 3 días.
      - Herpes labial 2 g VO cada 12 h por 1 día.
    a: Ajustar a la función renal.
    c: Alergia a aciclovir o valaciclovir.
    e: Cefalea, náuseas y neurotoxicidad en la ERC.
    em: Compatible con el embarazo y la lactancia.
  - n: Famciclovir
    g: Antiviral · profármaco del penciclovir
    fam: Antivirales
    q: Profármaco oral del penciclovir, activo contra herpes simple y varicela zóster.
    u:
      - Herpes zóster.
      - Herpes genital y labial recurrentes.
    d:
      - Herpes zóster 500 mg VO cada 8 h por 7 días.
      - Herpes genital recurrente 1 g VO cada 12 h por 1 día.
    a: Ajustar a la función renal.
    e: Cefalea y náuseas.
    em: Preferir aciclovir o valaciclovir en el embarazo (más experiencia).
  - n: Valganciclovir
    g: Antiviral · profármaco del ganciclovir
    fam: Antivirales
    q: Profármaco oral del ganciclovir, activo contra citomegalovirus (CMV).
    u:
      - Profilaxis y tratamiento de la infección por CMV en trasplantados.
      - Retinitis por CMV en personas con VIH.
    d:
      - Tratamiento (inducción) 900 mg VO cada 12 h por 21 días; luego 900 mg al día.
      - Profilaxis 900 mg VO al día.
    a: Ajustar estrictamente a la función renal.
    c: Neutrófilos < 500/µL, plaquetas < 25.000/µL o Hb < 8 g/dL. Embarazo.
    e: Mielosupresión (neutropenia, anemia, trombocitopenia), diarrea; es teratogénico y carcinogénico.
    i: Más mielosupresión con micofenolato, cotrimoxazol y zidovudina.
    em: Contraindicado en el embarazo; usar anticoncepción eficaz.
  - n: Oseltamivir
    g: Antiviral inhibidor de la neuraminidasa
    fam: Antivirales
    q: Inhibe la neuraminidasa de los virus influenza A y B y limita su replicación.
    u:
      - Influenza en hospitalizados, graves o con alto riesgo (≥ 65 años, embarazo, comorbilidad), aunque hayan pasado más de 48 h.
      - Profilaxis de contactos de alto riesgo.
    d:
      - Tratamiento 75 mg VO cada 12 h por 5 días.
      - Profilaxis 75 mg VO al día por 10 días.
    a: Depuración 30–60 mL/min 30 mg cada 12 h; 10–30 mL/min 30 mg al día.
    e: Náuseas y vómitos (tomar con comida); rara vez, síntomas neuropsiquiátricos.
    em: Recomendado en la embarazada con influenza (alto riesgo de complicaciones).
    p: Iniciarlo cuanto antes, sin esperar la confirmación, en el paciente grave o de riesgo.
  - n: Entecavir
    g: Antiviral contra el virus de la hepatitis B
    fam: Antivirales
    q: Análogo de nucleósido con alta potencia y alta barrera a la resistencia contra el VHB.
    u:
      - Hepatitis B crónica con indicación de tratamiento.
      - Profilaxis de la reactivación del VHB antes de inmunosupresión intensa (rituximab, quimioterapia).
    d:
      - 0,5 mg VO al día en ayunas (1 mg si hay resistencia a lamivudina).
    a: Ajustar a la función renal.
    e: Cefalea y fatiga. Al suspenderlo puede haber una reactivación grave de la hepatitis.
    i: No es activo contra el VIH como tratamiento; en coinfectados, el esquema debe incluir fármacos activos contra ambos virus.
    em: En el embarazo se prefiere tenofovir.
  - n: Nirsevimab
    g: Anticuerpo monoclonal contra el virus respiratorio sincicial
    fam: Antivirales
    q: Anticuerpo monoclonal de vida media prolongada contra la proteína F del VRS. Da protección pasiva durante toda la temporada con una sola dosis.
    u:
      - Prevención de la infección grave por VRS en lactantes en su primera temporada (estrategia nacional en Chile).
      - Segunda temporada en niños con alto riesgo (cardiopatías, prematurez extrema, enfermedad pulmonar crónica).
    dt: Dosis (lactantes)
    d:
      - Peso < 5 kg 50 mg IM en dosis única.
      - Peso ≥ 5 kg 100 mg IM en dosis única.
      - Segunda temporada en niños de riesgo 200 mg IM.
    e: Exantema, fiebre y reacciones en el sitio de punción, poco frecuentes.
    i: Puede administrarse junto con las vacunas del calendario.
  - n: Anfotericina B
    g: Antifúngico poliénico
    fam: Antifúngicos
    q: Antifúngico de muy amplio espectro que se une al ergosterol de la membrana fúngica. La formulación liposomal es menos nefrotóxica.
    u:
      - Meningitis criptocócica (inducción, con flucitosina).
      - Mucormicosis.
      - Histoplasmosis y otras micosis endémicas graves; candidiasis y aspergilosis refractarias.
    d:
      - Liposomal 3–5 mg/kg EV al día (mucormicosis 5–10 mg/kg).
      - Desoxicolato 0,7–1 mg/kg EV al día.
    a: Preferir la liposomal en la ERC; hidratar con suero fisiológico antes de cada dosis.
    e: Nefrotoxicidad, hipokalemia, hipomagnesemia, acidosis tubular, reacciones a la infusión (fiebre, calofríos) y anemia.
    i: Más nefrotoxicidad con aminoglicósidos, vancomicina y ciclosporina.
    em: Es el antifúngico de elección para las micosis graves en el embarazo.
  - n: Caspofungina
    g: Antifúngico equinocandina
    fam: Antifúngicos
    q: Inhibe la síntesis de la pared fúngica (beta-glucano). Fungicida contra Candida, incluida C. glabrata.
    u:
      - Candidemia y candidiasis invasora (primera línea).
      - Neutropenia febril persistente (empírica) y aspergilosis refractaria.
    d:
      - 70 mg EV de carga y luego 50 mg EV al día.
    a: En la insuficiencia hepática moderada, 35 mg al día después de la carga. No requiere ajuste renal.
    e: Buen perfil. Flebitis, alza de transaminasas y reacciones por liberación de histamina.
    i: No alcanza buenas concentraciones en el ojo, el SNC ni la orina.
    em: Usar si el beneficio lo justifica.
  - n: Fluconazol
    g: Antifúngico azólico
    fam: Antifúngicos
    q: Azol con buena biodisponibilidad oral y penetración en el SNC y la orina. Activo contra la mayoría de Candida albicans y Cryptococcus; no contra Aspergillus ni C. krusei.
    u:
      - Candidiasis vulvovaginal, orofaríngea y esofágica.
      - Candidemia por cepas sensibles, como paso a vía oral.
      - Meningitis criptocócica (consolidación y mantención).
    d:
      - Candidiasis vulvovaginal 150 mg VO en dosis única.
      - Candidiasis orofaríngea 100–200 mg al día por 7–14 días; esofágica 200–400 mg al día por 14–21 días.
      - Candidemia 800 mg de carga y luego 400 mg al día.
    a: Reducir la dosis a la mitad con depuración < 50 mL/min (después de la carga).
    c: Uso de fármacos que prolongan mucho el QT. Alergia a azoles.
    e: Náuseas, hepatotoxicidad y prolongación del QT.
    i: Inhibe el CYP2C9 y el CYP3A4. Aumenta el INR con warfarina y los niveles de sulfonilureas, fenitoína y estatinas.
    em: Evitar dosis altas o prolongadas en el embarazo (teratogénico). En la candidiasis vaginal de la embarazada se prefieren los azoles tópicos.
  - n: Nistatina
    g: Antifúngico poliénico no absorbible
    fam: Antifúngicos
    q: Antifúngico que no se absorbe en el intestino; actúa por contacto sobre Candida.
    u:
      - Candidiasis oral (algorra) y del pañal.
    d:
      - Suspensión 100.000 UI/mL, 4–6 mL cada 6 h por 7–14 días; mantener en la boca antes de tragar.
    e: Náuseas y diarrea leves.
    em: Compatible con el embarazo y la lactancia.
  - n: Albendazol
    g: Antiparasitario benzimidazol
    fam: Antiparasitarios y antipalúdicos
    q: Antihelmíntico de amplio espectro que inhibe la polimerización de la tubulina del parásito.
    u:
      - Neurocisticercosis (con corticoides).
      - Hidatidosis (antes y después de la cirugía o la punción).
      - Triquinosis, ascariasis, uncinariasis, oxiuriasis y toxocariasis.
    d:
      - Geohelmintos y oxiuros 400 mg VO en dosis única (oxiuros, repetir a las 2 semanas).
      - Neurocisticercosis 15 mg/kg/día (máximo 800 mg) en 2 tomas por 10–14 días.
      - Hidatidosis 400 mg VO cada 12 h en ciclos.
      - Triquinosis 400 mg VO cada 12 h por 10–14 días.
    c: Embarazo (primer trimestre).
    e: Dolor abdominal, alza de transaminasas, neutropenia y alopecia en tratamientos largos.
    i: Tomarlo con comida grasa aumenta su absorción en las infecciones tisulares.
    em: Evitar en el primer trimestre del embarazo.
    p: En los tratamientos largos, controlar el hemograma y las transaminasas cada 2 semanas.
  - n: Mebendazol
    g: Antiparasitario benzimidazol
    fam: Antiparasitarios y antipalúdicos
    q: Antihelmíntico de acción intestinal (se absorbe poco).
    u:
      - Oxiuriasis, ascariasis, tricocefalosis y uncinariasis.
    d:
      - Oxiuros 100 mg VO en dosis única; repetir a las 2 semanas y tratar a la familia.
      - Ascariasis y tricocefalosis 100 mg VO cada 12 h por 3 días o 500 mg en dosis única.
    e: Dolor abdominal y diarrea.
    em: Evitar en el primer trimestre del embarazo.
  - n: Ivermectina
    g: Antiparasitario avermectina
    fam: Antiparasitarios y antipalúdicos
    q: Antiparasitario que paraliza nematodos y ectoparásitos.
    u:
      - Estrongiloidiasis (también antes de iniciar corticoides en personas de riesgo).
      - Escabiosis (sarna), incluida la costrosa junto a permetrina, y pediculosis.
    d:
      - Estrongiloidiasis 200 µg/kg VO al día por 1–2 días.
      - Escabiosis 200 µg/kg VO; repetir a los 7–14 días.
    c: Embarazo. Niños de menos de 15 kg.
    e: Prurito, mareo y náuseas.
    em: Evitar en el embarazo.
  - n: Cloroquina
    g: Antipalúdico 4-aminoquinolina
    fam: Antiparasitarios y antipalúdicos
    q: Antipalúdico esquizonticida sanguíneo. Muchas cepas de Plasmodium falciparum son resistentes.
    u:
      - Malaria por P. vivax, P. ovale y P. malariae, y P. falciparum de zonas sin resistencia.
    d:
      - 10 mg/kg de cloroquina base VO, luego 5 mg/kg a las 6, 24 y 48 h (total 25 mg/kg base).
      - En la malaria por P. vivax o P. ovale se agrega primaquina (tras descartar déficit de G6PD).
    e: Prurito, molestias digestivas, prolongación del QT, hipoglicemia y retinopatía con uso prolongado.
    i: Precaución con otros fármacos que prolongan el QT.
    em: Compatible con el embarazo.
  - n: Tenofovir
    g: Antiviral · análogo de nucleótido
    fam: Antivirales
    q: Inhibe la transcriptasa inversa del VIH y la polimerasa del virus de la hepatitis B. Existe como disoproxil (TDF) y alafenamida (TAF).
    u:
      - Hepatitis B crónica (primera línea, con entecavir).
      - Prevención de la transmisión vertical del VHB (ADN > 200 000 UI/mL).
      - VIH (parte de la terapia antirretroviral y de la profilaxis preexposición).
    d:
      - Tenofovir disoproxil 300 mg/día VO.
      - Tenofovir alafenamida 25 mg/día VO.
      - Embarazo con ADN > 200 000 UI/mL desde las semanas 24–28.
    a: TDF se ajusta a la función renal; TAF no se usa con depuración < 15 mL/min sin diálisis.
    c: Alergia al fármaco.
    e: TDF, tubulopatía proximal, caída del fósforo y de la densidad ósea; TAF, más aumento de peso y lípidos.
    i: Más nefrotoxicidad con otros nefrotóxicos y AINE.
    em: Compatible con el embarazo y la lactancia.
    p: Al suspenderlo en la hepatitis B puede haber una reactivación grave; controlar transaminasas.
  - n: Dolutegravir
    g: Antiviral · inhibidor de la integrasa
    fam: Antivirales
    q: Inhibidor de la integrasa del VIH con alta barrera de resistencia; base de los esquemas antirretrovirales de primera línea.
    u:
      - Tratamiento del VIH (con dos análogos de nucleósido o con lamivudina).
    d:
      - 50 mg VO una vez al día.
      - Con rifampicina 50 mg cada 12 h.
    c: Uso con dofetilida.
    e: Insomnio, cefalea, aumento de peso y alza leve de la creatinina (sin daño renal real).
    i: Los antiácidos y suplementos de calcio, hierro o magnesio reducen su absorción (separar 2 h antes o 6 h después); la rifampicina obliga a doblar la dosis; sube los niveles de metformina.
    em: Compatible con el embarazo (se prefiere en las guías actuales).
    p: El alza de la creatinina en las primeras semanas es por bloqueo de su secreción tubular, no por nefrotoxicidad.
  - n: Nirmatrelvir/ritonavir
    g: Antiviral · inhibidor de la proteasa del SARS-CoV-2
    fam: Antivirales
    q: Inhibe la proteasa principal del SARS-CoV-2; el ritonavir eleva sus niveles al bloquear el CYP3A4.
    u:
      - COVID-19 leve a moderado en pacientes con alto riesgo de progresión, dentro de los 5 días de síntomas.
    d:
      - 300 mg/100 mg VO cada 12 h por 5 días.
    a: TFG 30–60, 150 mg/100 mg cada 12 h; TFG < 30 no se recomienda.
    c: Fármacos muy dependientes del CYP3A4 con riesgo grave (amiodarona, algunos antiarrítmicos, rifampicina, carbamazepina, estatinas como simvastatina) e insuficiencia hepática grave.
    e: Disgeusia, diarrea e hipertensión.
    i: Muchas e importantes por el ritonavir (tacrolimus, anticoagulantes, estatinas, antiepilépticos); revisar siempre una herramienta de interacciones.
    em: Usar si el beneficio lo justifica.
    p: Antes de indicarlo, revisar todos los fármacos del paciente; muchas veces basta suspender la estatina por unos días.
  - n: Sofosbuvir/velpatasvir
    g: Antiviral de acción directa · combinación pangenotípica
    fam: Antivirales
    q: Combinación de un inhibidor de la polimerasa NS5B (sofosbuvir) y uno de la NS5A (velpatasvir) que cura la hepatitis C de cualquier genotipo.
    u:
      - Hepatitis C crónica (esquema GES).
    d:
      - 400 mg/100 mg, 1 comprimido al día por 12 semanas.
    a: Evitar con depuración de creatinina < 30 mL/min.
    c: Uso con amiodarona (bradicardia grave).
    e: Cefalea y fatiga.
    i: Amiodarona (bradicardia); los IBP y antiácidos reducen la absorción del velpatasvir; rifampicina y carbamazepina bajan sus niveles; reactivación del VHB en coinfectados.
    em: Sin datos suficientes; no se indica en el embarazo.
    p: Antes de iniciar, buscar la hepatitis B (HBsAg), porque puede reactivarse al eliminar el VHC.
  - n: Voriconazol
    g: Antifúngico triazol
    fam: Antifúngicos
    q: Triazol de amplio espectro que inhibe la síntesis de ergosterol; es el tratamiento de primera línea de la aspergilosis invasora.
    u:
      - Aspergilosis invasora (primera línea).
      - Candidiasis esofágica refractaria al fluconazol.
    d:
      - EV 6 mg/kg cada 12 h por 2 dosis y luego 4 mg/kg cada 12 h.
      - VO 200–300 mg cada 12 h.
      - Candidiasis esofágica refractaria 200 mg cada 12 h por 14–21 días.
    a: Ajustar por niveles plasmáticos. En la ERC preferir la vía oral (el vehículo EV se acumula).
    c: Uso con rifampicina, carbamazepina o fármacos que alargan el QT de alto riesgo.
    e: Alteraciones visuales transitorias, alucinaciones, hepatotoxicidad, fotosensibilidad y QT largo.
    i: Potente inhibidor del CYP3A4 (tacrolimus, ciclosporina, warfarina, estatinas, benzodiacepinas).
    em: Contraindicado en el embarazo.
    p: Medir los niveles valle; la variabilidad entre pacientes es muy grande.
  - n: Terbinafina
    g: Antifúngico alilamina
    fam: Antifúngicos
    q: Inhibe la escualeno epoxidasa de los dermatofitos; es fungicida y se acumula en la uña y la piel.
    u:
      - Onicomicosis confirmada.
      - Tiña de la cabeza por *Trichophyton*.
      - Tiñas extensas o refractarias (oral) y tiña del pie o del cuerpo (crema).
    d:
      - Onicomicosis 250 mg/día VO por 6 semanas (manos) o 12 semanas (pies).
      - Tiña de la cabeza 10–20 kg 62,5 mg, 20–40 kg 125 mg, > 40 kg 250 mg/día por 4 semanas.
    a: Evitar en la insuficiencia hepática y con depuración < 50 mL/min.
    c: Hepatopatía crónica o activa.
    e: Hepatotoxicidad (rara pero grave), alteración del gusto, exantema.
    i: Inhibe el CYP2D6 (sube antidepresivos tricíclicos, betabloqueadores y tamoxifeno pierde efecto).
    em: Evitar en el embarazo.
    p: Confirmar la onicomicosis con KOH o cultivo antes de un tratamiento de 3 meses.
  - n: Clotrimazol
    g: Antifúngico imidazol tópico
    fam: Antifúngicos
    q: Azol de uso local en piel y mucosas, activo sobre *Candida* y dermatofitos.
    u:
      - Candidiasis orofaríngea leve.
      - Balanitis candidiásica, intertrigo y dermatitis del pañal.
      - Candidiasis vulvovaginal no complicada.
    d:
      - Candidiasis orofaríngea tabletas bucales 10 mg 5 veces al día por 7–14 días.
      - Crema al 1 % 2 veces al día por 7–14 días.
      - Vaginal crema al 1 % por 7–14 días o al 2 % por 3 días.
    c: Alergia a imidazoles.
    e: Irritación local.
    em: Compatible (vía tópica y vaginal).
  - n: Ketoconazol
    g: Antifúngico imidazol · inhibidor de la esteroidogénesis
    fam: Antifúngicos
    q: Azol que hoy se usa sobre todo por vía tópica y, por vía oral, para bloquear la síntesis de cortisol.
    u:
      - Pitiriasis versicolor y dermatitis seborreica (champú o crema).
      - Síndrome de Cushing, como puente a la cirugía o si esta falla (especialista).
    d:
      - Pitiriasis versicolor champú al 2 % por 5 minutos y enjuagar, 1–3 días seguidos o diario por 5 días.
      - Cushing 400–1200 mg/día VO en 2 dosis.
    c: Hepatopatía (vía oral).
    e: Vía oral, hepatotoxicidad (controlar transaminasas), QT largo, ginecomastia e insuficiencia suprarrenal.
    i: Potente inhibidor del CYP3A4; necesita ácido gástrico (evitar IBP).
    em: Evitar la vía oral en el embarazo.
    p: Por vía oral ya no se usa como antifúngico por su hepatotoxicidad.
  - n: Primaquina
    g: Antipalúdico 8-aminoquinolina
    fam: Antiparasitarios y antipalúdicos
    q: Elimina los hipnozoítos hepáticos de *P. vivax* y *P. ovale* (cura radical) y evita las recaídas.
    u:
      - Cura radical de la malaria por *P. vivax* o *P. ovale*, después del tratamiento de la fase sanguínea.
    d:
      - 0,25–0,5 mg base/kg/día VO por 14 días.
    c: Déficit de G6PD (medirla antes), embarazo y lactancia.
    e: Hemólisis en el déficit de G6PD, metahemoglobinemia, molestias digestivas.
    em: Contraindicada en el embarazo y la lactancia.
    p: Medir siempre la G6PD antes de indicarla.
  - n: Artesunato
    g: Antipalúdico derivado de la artemisinina
    fam: Antiparasitarios y antipalúdicos
    q: Esquizonticida sanguíneo de acción muy rápida; reduce la mortalidad de la malaria grave frente a la quinina.
    u:
      - Malaria grave por cualquier especie.
    d:
      - 2,4 mg/kg EV a las 0, 12 y 24 h y luego cada 24 h hasta tolerar la vía oral (mínimo 24 h EV); completar con una combinación oral con artemisinina por 3 días.
    c: Alergia a derivados de la artemisinina.
    e: Hemólisis tardía (controlar la hemoglobina por 4 semanas), bradicardia.
    em: Se usa en la malaria grave en cualquier trimestre.
    p: Después de una malaria grave tratada con artesunato, controlar la hemoglobina por 4 semanas por la hemólisis tardía.
  - n: Praziquantel
    g: Antihelmíntico (cestodos y trematodos)
    fam: Antiparasitarios y antipalúdicos
    q: Aumenta la permeabilidad al calcio de la membrana del parásito, que queda paralizado y se desprende.
    u:
      - Teniasis (*Taenia*) y difilobotriasis (*Dibothriocephalus*).
      - "*Hymenolepis nana*."
      - Neurocisticercosis (con albendazol y corticoides, especialista).
    d:
      - Teniasis y difilobotriasis 5–10 mg/kg VO en dosis única.
      - "*Hymenolepis nana* 25 mg/kg en dosis única."
    c: Cisticercosis ocular.
    e: Mareo, dolor abdominal y cefalea.
    i: Rifampicina y carbamazepina bajan mucho sus niveles.
    em: Usar si el beneficio lo justifica.
    p: "Con *T. solium*, descartar la neurocisticercosis antes: el praziquantel puede desencadenar convulsiones."
  - n: Nitazoxanida
    g: Antiparasitario de amplio espectro
    fam: Antiparasitarios y antipalúdicos
    q: Tiazólido que inhibe el metabolismo energético anaerobio de protozoos y helmintos.
    u:
      - Criptosporidiosis.
      - Giardiasis (alternativa).
      - "*Hymenolepis nana* (alternativa)."
    d:
      - 500 mg VO cada 12 h por 3 días.
      - En el VIH con *Cryptosporidium*, 500–1000 mg cada 12 h por 14 días como complemento de la TAR.
    c: Alergia al fármaco.
    e: Dolor abdominal, cefalea y orina amarillo intenso.
    em: Datos limitados.
    p: En el VIH, lo que cura la criptosporidiosis es la recuperación de los CD4 con la TAR.
  - n: Permetrina
    g: Ectoparasiticida piretroide
    fam: Antiparasitarios y antipalúdicos
    q: Bloquea los canales de sodio de los artrópodos y los paraliza.
    u:
      - Escabiosis.
      - Pediculosis de la cabeza.
    d:
      - Escabiosis crema al 5 % en todo el cuerpo desde el cuello, en la noche por 8–12 h; repetir a los 7 días.
      - Pediculosis loción al 1 % por 10 minutos en el pelo seco y enjuagar; repetir a los 7–10 días.
    c: Alergia a piretroides.
    e: Prurito y ardor transitorios (el prurito de la escabiosis puede durar semanas después de curada).
    em: Compatible con el embarazo y la lactancia.
    p: En la escabiosis tratar a todos los contactos al mismo tiempo y lavar la ropa de cama a 60 °C.
