orden: 12
titulo: Ginecología, obstetricia, urología y dermatología
familias:
  - Obstetricia
  - Anticoncepción
  - Terapia hormonal y fertilidad
  - Urología y andrología
  - Dermatología
farmacos:
  - n: Oxitocina
    g: Uterotónico · hormona hipofisaria
    fam: Obstetricia
    q: Estimula las contracciones del útero grávido; efecto inmediato y corto.
    u:
      - Prevención de la hemorragia posparto (manejo activo del alumbramiento).
      - Tratamiento de la atonía uterina.
      - Inducción y conducción del trabajo de parto.
    d:
      - Prevención 10 UI IM tras la salida del hombro anterior.
      - Atonía 20–40 UI en 1.000 mL de suero a 150–250 mL/h.
      - Inducción 1–2 mUI/min EV, aumentando cada 30–40 min según la dinámica uterina.
    c: Desproporción cefalopélvica, sufrimiento fetal, presentación anómala, placenta previa (para la inducción).
    e: Taquisistolia con compromiso fetal, rotura uterina, hipotensión con bolos rápidos e intoxicación hídrica (hiponatremia) con dosis altas.
    em: Uso obstétrico.
  - n: Carbetocina
    g: Uterotónico · análogo de oxitocina de acción prolongada
    fam: Obstetricia
    q: Análogo de oxitocina que actúa por más tiempo con una sola dosis.
    u:
      - Prevención de la hemorragia posparto en la cesárea.
    d:
      - 100 µg EV lenta en dosis única, después de la extracción del recién nacido.
    c: Antes del nacimiento (no sirve para inducir), enfermedad cardiovascular grave, epilepsia.
    e: Cefalea, hipotensión, rubor, náuseas.
    em: Uso obstétrico.
  - n: Misoprostol
    g: Análogo de la prostaglandina E1
    fam: Obstetricia
    q: Prostaglandina estable a temperatura ambiente que contrae el útero y madura el cuello.
    u:
      - Hemorragia posparto (tratamiento y prevención si no hay oxitocina).
      - Aborto retenido, aborto incompleto e interrupción del embarazo (con mifepristona).
      - Maduración cervical e inducción del parto.
    d:
      - Hemorragia posparto 800 µg sublingual; prevención 600 µg VO.
      - Interrupción del embarazo 800 µg vaginal o bucal 24–48 h después de 200 mg de mifepristona.
      - Inducción 25 µg vaginal cada 4–6 h.
    c: Cicatriz uterina en la inducción del 2.° o 3.er trimestre (rotura uterina). Embarazo deseado (cuando se usa como gastroprotector).
    e: Fiebre, calofríos, diarrea, cólicos y taquisistolia.
    em: Contraindicado como gastroprotector en mujeres embarazadas.
  - n: Mifepristona
    g: Antagonista de los receptores de progesterona
    fam: Obstetricia
    q: Bloquea la progesterona; desprende la decidua y sensibiliza al útero a las prostaglandinas.
    u:
      - Interrupción del embarazo según la legislación vigente (junto con misoprostol).
      - Muerte fetal y aborto retenido (preparación para el misoprostol).
    d:
      - 200 mg VO en dosis única, seguido de misoprostol 24–48 h después.
    c: Embarazo ectópico no descartado, insuficiencia suprarrenal, uso crónico de corticoides, trastornos de la coagulación o anticoagulación, porfiria, DIU in situ.
    e: Sangrado, cólicos, náuseas y vómitos.
    em: Uso obstétrico.
  - n: Levonorgestrel
    g: Progestágeno
    fam: Anticoncepción
    q: Progestágeno que, en dosis alta, retrasa o inhibe la ovulación (no interrumpe un embarazo ya implantado). También se usa en dispositivos intrauterinos.
    u:
      - Anticoncepción de emergencia.
      - Anticoncepción y sangrado menstrual abundante (DIU con levonorgestrel).
    d:
      - Emergencia 1,5 mg VO en dosis única, lo antes posible y dentro de las 72 h (hasta 120 h, con menor eficacia).
      - DIU de 52 mg, que dura 5–8 años según el modelo.
    i: Los inductores enzimáticos (rifampicina, carbamazepina) reducen su eficacia; en ellas, usar 3 mg o un DIU de cobre.
    e: Náuseas, sangrado irregular y cambios en la fecha de la menstruación.
    em: No daña un embarazo en curso si falla.
    p: Es menos eficaz con un IMC > 30; el DIU de cobre es la anticoncepción de emergencia más eficaz.
  - n: Finasterida
    g: Inhibidor de la 5-alfa reductasa
    fam: Urología y andrología
    q: Bloquea la conversión de testosterona a dihidrotestosterona; reduce el volumen prostático.
    u:
      - Hiperplasia prostática benigna con próstata grande (> 30–40 mL), sola o con un alfa-bloqueador.
      - Alopecia androgénica masculina (1 mg).
    d:
      - Hiperplasia prostática 5 mg VO al día (efecto en 6 meses).
    c: Mujeres embarazadas o que pueden embarazarse (no manipular comprimidos rotos).
    e: Disfunción eréctil, baja de la libido, ginecomastia.
    i: Reduce el APE a la mitad (duplicar el valor para interpretarlo).
    em: Contraindicada (feminización del feto masculino).
  - n: Tamsulosina
    g: Bloqueador alfa-1A uroselectivo
    fam: Urología y andrología
    q: Relaja el músculo liso de la próstata, el cuello vesical y el uréter distal.
    u:
      - Síntomas urinarios por hiperplasia prostática benigna.
      - Terapia expulsiva de cálculos del uréter distal de 5–10 mm.
    d:
      - 0,4 mg VO al día.
    e: Hipotensión ortostática, mareo, eyaculación retrógrada y síndrome del iris flácido en la cirugía de cataratas.
    i: Más hipotensión con inhibidores de la PDE-5 y otros antihipertensivos.
    em: No aplica.
    p: Preguntar si tiene una cirugía de cataratas programada y avisar al oftalmólogo.
  - n: Sildenafil
    g: Inhibidor de la fosfodiesterasa 5 (PDE-5)
    fam: Urología y andrología
    q: Potencia el óxido nítrico; produce vasodilatación en el cuerpo cavernoso y en las arterias pulmonares.
    u:
      - Disfunción eréctil.
      - Hipertensión arterial pulmonar.
    d:
      - Disfunción eréctil 50 mg VO 1 h antes de la relación (25–100 mg).
      - Hipertensión pulmonar 20 mg VO cada 8 h.
    c: Uso de nitratos o riociguat, IAM o ACV reciente, hipotensión, antecedente de neuropatía óptica isquémica.
    e: Cefalea, rubor, congestión nasal, dispepsia, visión azulada y priapismo.
    i: Hipotensión grave con nitratos. Reducir la dosis con inhibidores del CYP3A4. Más hipotensión con alfa-bloqueadores.
    em: Se usa en la hipertensión pulmonar del embarazo según el especialista.
  - n: Alprostadil
    g: Prostaglandina E1
    fam: Urología y andrología
    q: Vasodilatador que mantiene abierto el ductus arterioso y produce erección por vía intracavernosa.
    u:
      - Cardiopatías congénitas dependientes del ductus en el recién nacido (mientras se resuelve).
      - Disfunción eréctil (intracavernosa).
    dt: Dosis
    d:
      - Recién nacido 0,05–0,1 µg/kg/min EV; luego la menor dosis eficaz (0,01–0,05 µg/kg/min).
      - Disfunción eréctil 2,5–20 µg intracavernosos, ajustando la dosis.
    e: En el recién nacido, apnea (sobre todo en los de bajo peso y en la primera hora), fiebre, hipotensión y rubor. Intracavernoso, dolor y priapismo.
    em: No aplica.
    p: Al iniciarlo en un recién nacido, tener todo listo para intubar por el riesgo de apnea.
  - n: Clobetasol
    g: Corticoide tópico de potencia muy alta
    fam: Dermatología
    q: Corticoide tópico de la clase de mayor potencia.
    u:
      - Psoriasis en placas, liquen plano y dermatitis crónicas liquenificadas.
      - Liquen escleroso vulvar (de elección).
      - Penfigoide ampolloso.
    d:
      - Crema o ungüento al 0,05 % 1–2 veces al día por 2–4 semanas (máximo 50 g por semana).
    c: Rosácea, acné, dermatitis perioral, infecciones cutáneas no tratadas. Evitar en la cara, los pliegues y los niños.
    e: Atrofia cutánea, estrías, telangiectasias, dermatitis perioral y supresión suprarrenal si se usa en grandes áreas.
    em: Usar en áreas pequeñas y por poco tiempo.
  - n: Estradiol
    g: Estrógeno natural
    fam: Terapia hormonal y fertilidad
    q: Estrógeno idéntico al humano; se usa oral o transdérmico para reemplazar el déficit estrogénico.
    u:
      - Síndrome climatérico (bochornos) en menores de 60 años o con menos de 10 años de menopausia.
      - Insuficiencia ovárica prematura (hasta la edad promedio de la menopausia natural).
    d:
      - Oral 1 mg/día.
      - Transdérmico gel 0,5–0,75 mg/día o parche de 50 µg/día.
      - Insuficiencia ovárica prematura 2 mg/día oral o 100 µg/día transdérmico.
    c: Cáncer de mama o de endometrio, trombosis venosa o arterial, enfermedad hepática activa, sangrado genital no estudiado.
    e: Mastalgia, sangrado, trombosis venosa (vía oral) e hiperplasia endometrial si se da sin progestágeno.
    i: Los inductores (rifampicina, carbamazepina) bajan sus niveles; requiere subir la levotiroxina por vía oral.
    em: No se usa en el embarazo.
    p: Si la mujer tiene útero, siempre con un progestágeno; preferir la vía transdérmica con obesidad, HTA, diabetes o riesgo de trombosis.
  - n: Progesterona micronizada
    g: Progestágeno natural
    fam: Terapia hormonal y fertilidad
    q: Progesterona idéntica a la humana; protege el endometrio del efecto estrogénico con un perfil metabólico y de mama favorable.
    u:
      - Protección endometrial en la terapia hormonal de la mujer con útero.
      - Prevención del parto prematuro en mujeres con cuello corto (vía vaginal).
    d:
      - Terapia hormonal 200 mg/noche por 10–14 días al mes (cíclico) o 100 mg/noche (continuo), oral o vaginal.
    c: Cáncer de mama, trombosis activa, sangrado genital no estudiado.
    e: Somnolencia (tomar en la noche), mareo y sangrado irregular.
    em: Se usa en el embarazo (prevención del parto prematuro).
    p: Darla en la noche aprovecha su efecto sedante.
  - n: Medroxiprogesterona
    g: Progestágeno sintético
    fam: Terapia hormonal y fertilidad
    q: Progestágeno oral o inyectable que transforma el endometrio en secretor.
    u:
      - Protección endometrial en la anovulación y en la terapia hormonal.
      - Sangrado uterino anormal agudo (dosis altas).
      - Anticoncepción inyectable trimestral (de depósito).
    d:
      - Anovulación 10 mg/día por 10–14 días cada 1–3 meses.
      - Sangrado uterino agudo 20 mg cada 8 h por 7 días.
      - Terapia hormonal 5–10 mg/día por 10–14 días (cíclico) o 2,5 mg/día (continuo).
    c: Cáncer de mama, trombosis activa, sangrado genital no estudiado, embarazo.
    e: Sangrado irregular, aumento de peso, cambios del ánimo; el depósito baja la densidad ósea.
    em: No se usa en el embarazo.
    p: Tras su retiro, el sangrado aparece en 3–10 días; si no sangra, pensar en hipoestrogenismo o embarazo.
  - n: Letrozol
    g: Inhibidor de la aromatasa
    fam: Terapia hormonal y fertilidad
    q: Bloquea la conversión de andrógenos en estrógenos; en dosis cortas induce la ovulación y en uso continuo trata el cáncer de mama hormonosensible.
    u:
      - Inducción de la ovulación en el SOP (primera línea, especialista).
      - Cáncer de mama con receptores hormonales positivos en la posmenopáusica.
    d:
      - Inducción de la ovulación 2,5 mg/día por 5 días (días 3–7 del ciclo), subir a 5–7,5 mg si no ovula.
      - Cáncer de mama 2,5 mg/día.
    c: Embarazo, premenopausia (para el cáncer, salvo con supresión ovárica).
    e: Uso prolongado, osteoporosis, artralgias y bochornos.
    em: Contraindicado en el embarazo (descartarlo antes de cada ciclo).
    p: En el cáncer de mama, pedir densitometría al inicio y durante el tratamiento.
  - n: Oxibutinina
    g: Antimuscarínico vesical
    fam: Urología y andrología
    q: Bloquea los receptores muscarínicos del detrusor y reduce las contracciones no inhibidas.
    u:
      - Vejiga hiperactiva e incontinencia de urgencia.
      - Enuresis con síntomas diurnos (combinada con desmopresina).
    d:
      - Adultos 5 mg VO cada 8–12 h.
      - Niños 2,5–5 mg en la noche.
    c: Glaucoma de ángulo estrecho, retención urinaria, miastenia, adulto mayor con demencia.
    e: Boca seca, constipación, retención urinaria y confusión (efecto central).
    i: Suma carga anticolinérgica; reduce el efecto de los inhibidores de la colinesterasa.
    em: Evitar en el embarazo.
    p: Evitarla en el adulto mayor (Beers 2023); preferir mirabegrón.
  - n: Mirabegrón
    g: Agonista beta-3 adrenérgico
    fam: Urología y andrología
    q: Relaja el detrusor durante el llenado sin efecto anticolinérgico.
    u:
      - Vejiga hiperactiva e incontinencia de urgencia (de elección en el adulto mayor).
      - Síntomas de llenado en la HPB con residuo bajo.
    d:
      - 25–50 mg/día VO.
    a: Máximo 25 mg/día en la ERC grave o la insuficiencia hepática moderada.
    c: HTA grave no controlada.
    e: Alza de la presión arterial, taquicardia y cefalea.
    i: Inhibe el CYP2D6 (sube metoprolol y antidepresivos tricíclicos).
    em: Evitar en el embarazo.
    p: Controlar la presión arterial al iniciarlo.
  - n: Tadalafilo
    g: Inhibidor de la fosfodiesterasa 5
    fam: Urología y andrología
    q: Aumenta el GMPc y relaja el músculo liso del cuerpo cavernoso, la próstata y la arteria pulmonar; dura hasta 36 h.
    u:
      - Disfunción eréctil.
      - Síntomas urinarios bajos por HPB con disfunción eréctil.
      - Hipertensión pulmonar (especialista).
    d:
      - Disfunción eréctil 10–20 mg a demanda o 5 mg/día continuo.
      - HPB 5 mg/día.
      - Hipertensión pulmonar 40 mg/día.
    a: Bajar la dosis en la ERC y la insuficiencia hepática.
    c: Uso de nitratos o riociguat; infarto o ACV reciente, hipotensión.
    e: Cefalea, rubor, dispepsia, lumbalgia y congestión nasal.
    i: Hipotensión grave con nitratos (separar al menos 48 h); los inhibidores del CYP3A4 suben sus niveles.
    em: No aplica en la indicación urológica.
    p: Antes de dar nitratos en el dolor torácico, preguntar siempre por el uso de inhibidores de la fosfodiesterasa 5.
  - n: Dutasterida
    g: Inhibidor de la 5-alfa reductasa
    fam: Urología y andrología
    q: Bloquea la conversión de testosterona en dihidrotestosterona y reduce el volumen prostático.
    u:
      - Hiperplasia prostática con próstata grande (> 30–40 mL o APE > 1,5 ng/mL), sola o con un alfabloqueador.
    d:
      - 0,5 mg/día VO.
    c: Mujeres y niños.
    e: Disminución de la libido, disfunción eréctil y ginecomastia.
    em: Teratogénica para un feto masculino; las embarazadas no deben manipular las cápsulas rotas.
    p: Baja el APE a la mitad a los 6 meses; multiplicarlo por 2 para interpretarlo.
  - n: Isotretinoína
    g: Retinoide oral
    fam: Dermatología
    q: Derivado de la vitamina A que reduce mucho la glándula sebácea y la producción de sebo.
    u:
      - Acné nodular o quístico, o acné moderado refractario o con cicatrices (dermatólogo).
    d:
      - 0,5–1 mg/kg/día VO hasta una dosis acumulada de ~ 120–150 mg/kg.
    c: Embarazo, lactancia, uso de tetraciclinas (hipertensión endocraneana).
    e: Sequedad de piel y mucosas, alza de los lípidos y las transaminasas, alteraciones del ánimo.
    i: Con tetraciclinas, hipertensión endocraneana; evitar suplementos de vitamina A.
    em: Muy teratogénica; 2 métodos anticonceptivos desde 1 mes antes hasta 1 mes después.
    p: Controlar el perfil lipídico y las transaminasas al inicio y durante el tratamiento, y vigilar el ánimo.
