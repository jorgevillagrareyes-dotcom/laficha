orden: 4
titulo: Vasoactivos y fármacos del paro
familias:
  - Vasopresores e inotrópicos
  - Vasoconstrictores esplácnicos
farmacos:
  - n: Adrenalina
    g: Catecolamina · agonista alfa y beta adrenérgico
    fam: Vasopresores e inotrópicos
    q: Estimula los receptores alfa-1 (vasoconstricción), beta-1 (inotropismo y cronotropismo) y beta-2 (broncodilatación).
    u:
      - Paro cardiorrespiratorio.
      - Anafilaxia (por vía IM, de primera línea).
      - Shock refractario y bradicardia sintomática sin respuesta a atropina (infusión).
      - Laringitis obstructiva y estridor (nebulizada).
    d:
      - Paro 1 mg EV o IO cada 3–5 min.
      - Anafilaxia 0,01 mg/kg IM en el muslo (máximo 0,5 mg en el adulto) de la ampolla de 1 mg/mL; repetir cada 5–15 min.
      - Bradicardia 2–10 µg/min EV; shock 0,05–0,5 µg/kg/min EV.
    c: No tiene contraindicaciones absolutas en la anafilaxia ni en el paro.
    e: Taquiarritmias, hipertensión, isquemia miocárdica, hiperglicemia y alza del lactato.
    i: En usuarios de betabloqueadores la respuesta puede ser menor (en la anafilaxia, considerar glucagón).
    em: Se usa en el embarazo en la anafilaxia y el paro.
    p: "En la anafilaxia, nunca el bolo EV de 1 mg (solo en el paro): se usa la vía IM."
  - n: Noradrenalina
    g: Catecolamina · vasopresor alfa con efecto beta-1
    fam: Vasopresores e inotrópicos
    q: Vasoconstrictor potente con leve efecto inotrópico. Es el vasopresor de primera línea en el shock séptico.
    u:
      - Shock séptico y shock distributivo.
      - Shock cardiogénico con hipotensión persistente.
    d:
      - Iniciar 0,05–0,1 µg/kg/min EV y titular a PAM ≥ 65 mmHg. Preparación habitual 4 mg en 250 mL (16 µg/mL).
    a: Puede iniciarse por una vena periférica gruesa y proximal mientras se instala un catéter central.
    c: Hipovolemia no corregida (relativa).
    e: Isquemia digital, mesentérica o renal; arritmias; necrosis por extravasación.
    i: Si se extravasa, infiltrar fentolamina en la zona.
    em: Se usa en el embarazo si es necesario.
  - n: Dopamina
    g: Catecolamina · efecto dependiente de la dosis
    fam: Vasopresores e inotrópicos
    q: Precursor de la noradrenalina; en dosis medias estimula los receptores beta-1 y en dosis altas los alfa.
    u:
      - Bradicardia sintomática sin respuesta a atropina (alternativa al marcapaso).
    d:
      - 5–20 µg/kg/min EV.
    c: Feocromocitoma y taquiarritmias.
    e: Taquiarritmias (más que con noradrenalina), isquemia y necrosis por extravasación.
    em: Usar si se necesita.
    p: No se usa en el shock séptico (más arritmias y mortalidad que la noradrenalina) ni en dosis bajas para "proteger el riñón".
  - n: Dobutamina
    g: Inotrópico · agonista beta-1
    fam: Vasopresores e inotrópicos
    q: Aumenta la contractilidad y el gasto cardíaco; tiene leve efecto vasodilatador.
    u:
      - Shock cardiogénico o IC con hipoperfusión (perfil frío).
      - Disfunción cardíaca con hipoperfusión persistente en el shock séptico, sumada a noradrenalina.
      - Ecocardiograma de estrés.
    d:
      - 2,5–20 µg/kg/min EV.
    c: Miocardiopatía hipertrófica obstructiva, estenosis aórtica grave.
    e: Taquicardia, arritmias, hipotensión, isquemia miocárdica.
    i: Los betabloqueadores reducen su efecto.
    em: Usar si se necesita.
  - n: Milrinona
    g: Inotrópico · inhibidor de la fosfodiesterasa 3
    fam: Vasopresores e inotrópicos
    q: Inotrópico y vasodilatador que no depende de los receptores beta; útil en usuarios de betabloqueadores.
    u:
      - IC con bajo gasto e hipertensión pulmonar.
      - Shock cardiogénico (en especial con betabloqueo previo) y bajo gasto pediátrico.
    d:
      - 0,125–0,75 µg/kg/min EV, habitualmente sin bolo.
    a: Reducir la dosis en la ERC.
    e: Hipotensión, arritmias ventriculares y trombocitopenia.
    em: Usar si se necesita.
  - n: Vasopresina
    g: Vasopresor · hormona antidiurética
    fam: Vasopresores e inotrópicos
    q: Vasoconstrictor que actúa sobre los receptores V1, sin depender de los receptores adrenérgicos.
    u:
      - Shock séptico, como segundo vasopresor para ahorrar noradrenalina.
    d:
      - 0,03 U/min EV (dosis fija, no se titula).
    c: Isquemia mesentérica o coronaria activa.
    e: Isquemia digital, mesentérica y coronaria, hiponatremia.
    em: Usar si se necesita.
  - n: Terlipresina
    g: Análogo de la vasopresina · vasoconstrictor esplácnico
    fam: Vasoconstrictores esplácnicos
    q: Análogo de vasopresina de acción más larga que reduce el flujo y la presión portal.
    u:
      - Hemorragia digestiva variceal (antes de la endoscopía).
      - Síndrome hepatorrenal (con albúmina).
    d:
      - HDA variceal 2 mg EV cada 4 h por 48 h; luego 1 mg cada 4 h hasta 2–5 días.
      - Síndrome hepatorrenal 1 mg EV cada 4–6 h (o 2 mg al día en infusión), subir hasta 2 mg cada 4–6 h si no responde.
    c: Cardiopatía isquémica, arritmias, enfermedad vascular periférica o mesentérica. SpO₂ < 90 % o sobrecarga de volumen (síndrome hepatorrenal).
    e: Isquemia coronaria, mesentérica, cutánea y periférica; hiponatremia; insuficiencia respiratoria por sobrecarga.
    em: Contraindicada en el embarazo.
  - n: Somatostatina
    g: Hormona inhibidora · vasoconstrictor esplácnico
    fam: Vasoconstrictores esplácnicos
    q: Inhibe la secreción de hormonas gastrointestinales y reduce el flujo esplácnico.
    u:
      - Hemorragia digestiva variceal (alternativa a terlipresina u octreótido).
    d:
      - 250 µg EV en bolo y luego 250–500 µg/h por 2–5 días.
    e: Hiperglicemia o hipoglicemia, náuseas y bradicardia.
    em: Usar si se necesita.
  - n: Octreotide
    g: Análogo de la somatostatina
    fam: Vasoconstrictores esplácnicos
    q: Análogo de la somatostatina de vida media más larga, con efecto esplácnico y antisecretor.
    u:
      - Hemorragia digestiva variceal.
      - Hipoglicemia recurrente por sulfonilureas.
      - Acromegalia, tumores neuroendocrinos y fístulas digestivas de alto débito.
    d:
      - HDA variceal 50 µg EV en bolo y luego 50 µg/h por 2–5 días.
      - Hipoglicemia por sulfonilureas 50–100 µg SC cada 6–12 h.
    e: Náuseas, diarrea, litiasis biliar con uso prolongado, alteraciones de la glicemia y bradicardia.
    em: Usar si se necesita.
